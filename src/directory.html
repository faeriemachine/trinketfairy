---
title: Directory
layout: layouts/directory.njk
date: Last Modified
---
<link rel="stylesheet" href="/css/directory.css{{ nocache }}" />

<main>
    <article class="welcome">
        <h2>{{ title }}</h2>
        <p>
            Click on each plush to bring you to their page. <br>
            This archive is not conclusive and is always a work-in-progress. <br>
        </p>
        <p>
           <span id="updated"></span>
        </p>
    </article>
</main>

<article class="plushies" style="margin-top: 1em;">
    <div class="flex">
        {% for post in collections.postsAscending | reverse %}
            <a href="{{ post.url }}">
                <figure>
                    <img class="thumb" src="/img/thumbnail/{{ post.data.thumbnail }}" loading="lazy" />
            </a>
                    <figcaption>
                        {{ post.data.title }} • {{ post.data.pronouns }}
                    </figcaption>
                </figure>
        {% endfor %}
    </div>
</article>
